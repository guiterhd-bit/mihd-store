<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Xiaomi Hải Dương Store</title>

    <meta name="description"
          content="Kho ứng dụng dành cho Android TV">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- ==============================
         HEADER
    =============================== -->

    <header class="header">

        <div class="header-content">

            <h1 class="store-title">
                Xiaomi Hải Dương Store
            </h1>

            <p class="address">
                📍 Địa chỉ: 308 Đường Thanh Niên, TP. Hải Dương
            </p>

            <p class="hotline">
                📞 Hotline hỗ trợ: 0847.405.333 | 0789.996.222
            </p>

        </div>

    </header>


    <!-- ==============================
         SEARCH
    =============================== -->

    <section class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔍 Tìm kiếm ứng dụng..."
            autocomplete="off">

    </section>


    <!-- ==============================
         APP LIST
    =============================== -->

    <main id="appContainer">

        <!-- script.js sẽ tạo nội dung -->

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

        <div class="footer">

            <p>
                © 2026 Xiaomi Hải Dương Store
            </p>

            <p>
                Powered by GitHub Pages
            </p>

        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
