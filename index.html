<!DOCTYPE html>
<html lang="vi">

<head>

    <!-- ==============================
         THÔNG TIN TRANG
    =============================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Xiaomi Hải Dương Store</title>

    <meta
        name="description"
        content="Kho ứng dụng dành cho Android TV">


    <!-- ==============================
         FONT
    =============================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- ==============================
         CSS
    =============================== -->

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- ==============================
         HEADER
    =============================== -->

    <header class="header">

        <div class="header-content">


            <!-- Tên cửa hàng -->

            <h1 class="store-title">
                Xiaomi Hải Dương Store
            </h1>


            <!-- Mô tả cửa hàng -->

            <p class="store-description">
                Kho ứng dụng dành cho Android TV
            </p>


            <!-- Địa chỉ -->

            <p class="address">
                📍 Địa chỉ: 308 Đường Thanh Niên, TP. Hải Dương
            </p>


            <!-- Hotline -->

            <p class="hotline">
                📞 Hotline hỗ trợ: 0847.405.333 | 0789.996.222
            </p>


        </div>

    </header>


    <!-- ==============================
         SEARCH
    =============================== -->

    <section class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔍 Tìm kiếm ứng dụng..."
            autocomplete="off">

    </section>


    <!-- ==============================
         DANH SÁCH ỨNG DỤNG
    =============================== -->

    <main id="appContainer">

        <!--
            Nội dung ứng dụng được tạo
            tự động bởi script.js
        -->

    </main>


    <!-- ==============================
         FOOTER
    =============================== -->

    <footer>

        <div class="footer">

            <p>
                © 2026 Xiaomi Hải Dương Store
            </p>

            <p>
                Powered by GitHub Pages
            </p>

        </div>

    </footer>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script src="script.js"></script>


</body>

</html>
