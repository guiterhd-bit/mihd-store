<!DOCTYPE html>
<html lang="vi">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="header">

        <div class="header-content">

    <!-- Danh sách -->

    <main id="appContainer">

        <!-- script.js sẽ tạo nội dung -->

    <!-- Footer -->

    <footer>

        <div class="footer">

            <p>

                © 2026 MiHD Store

            </p>

        </div>
